<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Álbum Mundialista 2026</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet">

    <!-- Iconos -->
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="assets/css/album.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="#">
            <i class="bi bi-trophy-fill"></i>
            Álbum Mundial 2026
        </a>
        <a class="navbar-brand" href="../index.html">
            <i class="bi bi-trophy-fill"></i>
            Inicio
        </a>
        <a class="navbar-brand" href="juego/juego.html">
            <i class="bi bi-trophy-fill"></i>
            Juegos
        </a>

    </div>

</nav>



<!-- TITULO -->

<header class="container text-center mt-5">

    <h1 class="fw-bold">
        Álbum de Cromos Mundialista
    </h1>

    <p class="text-muted">
        Colecciona y desbloquea jugadores del Mundial
    </p>

</header>




<!-- ESTADISTICAS -->

<section class="container mt-4">

    <div class="row text-center">


        <div class="col-md-4 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h5>
                        Cromos desbloqueados
                    </h5>

                    <h2 id="contador">
                        0%
                    </h2>

                </div>

            </div>

        </div>



        <div class="col-md-4 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h5>
                        Total de goles
                    </h5>

                    <h2 id="totalGoles">
                        0
                    </h2>

                </div>

            </div>

        </div>




        <div class="col-md-4 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h5>
                        Jugadores
                    </h5>

                    <h2 id="cantidadJugadores">
                        0
                    </h2>

                </div>

            </div>

        </div>


    </div>

</section>





<!-- FILTROS -->

<section class="container mt-4">


    <div class="row g-3">


        <div class="col-md-6">

            <input 
            type="text"
            id="buscarNombre"
            class="form-control"
            placeholder="Buscar jugador...">

        </div>



        <div class="col-md-6">


            <select 
            id="buscarPais"
            class="form-select">


                <option value="">
                    Todos los países
                </option>


                <option value="Argentina">
                    🇦🇷 Argentina
                </option>


                <option value="Ecuador">
                    🇪🇨 Ecuador
                </option>


                <option value="Brasil">
                    🇧🇷 Brasil
                </option>


                <option value="Francia">
                    🇫🇷 Francia
                </option>

                <option value="Portugal">
                    🇵🇹 Portugal
                </option>

                <option value="Colombia">
                    🇨🇴 Colombia
                </option>


            </select>


        </div>


    </div>


</section>







<!-- ALBUM -->


<section class="container mt-5">


    <div 
    id="album"
    class="row g-4">


    </div>


</section>







<!-- MODAL INFORMACION -->

<div class="modal fade" id="modalJugador">


<div class="modal-dialog">


<div class="modal-content">


<div class="modal-header">

<h5 class="modal-title">
Información del jugador
</h5>


<button 
class="btn-close"
data-bs-dismiss="modal">

</button>


</div>



<div class="modal-body" id="infoJugador">


</div>



</div>


</div>


</div>







<!-- Bootstrap JS -->

<script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- JS propio -->

<script src="assets/js/album.js"></script>



</body>

</html>
