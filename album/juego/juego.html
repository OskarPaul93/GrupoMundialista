<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reto Mundialista</title>


    <!-- Bootstrap -->
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- CSS propio -->
    <link rel="stylesheet" href="assets/css/juego.css">


</head>



<body>



<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="../album.html">

            <i class="bi bi-controller"></i>

            Reto Mundialista

        </a>


    </div>

</nav>






<!-- CONTENIDO PRINCIPAL -->

<main class="container mt-5">



    <div class="text-center mb-5">


        <h1 class="fw-bold">

            🎮 Juego Mundialista

        </h1>


        <p class="text-muted">

            Responde preguntas sobre jugadores del Mundial y desbloquea cromos.

        </p>


    </div>








    <!-- PANEL DEL JUGADOR -->

    <section class="card shadow jugador-card mx-auto">


        <div class="card-body text-center">



            <img 
            id="imagenJugador"
            src="assets/img/default.png"
            class="imagen-jugador"
            alt="Jugador">



            <h2 
            id="nombreJugador"
            class="mt-3">

                Jugador

            </h2>




            <p 
            id="paisJugador"
            class="text-muted">

                País

            </p>



        </div>


    </section>









    <!-- PREGUNTA -->


    <section class="card shadow mt-4">


        <div class="card-body">



            <h4 
            id="pregunta"
            class="text-center">

                Pregunta

            </h4>



            <div 
            id="opciones"
            class="d-grid gap-3 mt-4">


                <!-- Aquí aparecerán las opciones con JS -->


            </div>



        </div>


    </section>








    <!-- RESULTADO -->


    <div 
    id="resultado"
    class="alert text-center mt-4 d-none">


        Resultado


    </div>









    <!-- BOTONES -->


    <div class="text-center mt-4">


        <button 
        id="btnJugar"
        class="btn btn-success btn-lg">


            <i class="bi bi-play-fill"></i>

            Jugar


        </button>





        <button 
        id="btnSiguiente"
        class="btn btn-primary btn-lg d-none">


            Siguiente pregunta

        </button>


    </div>









    <!-- PUNTAJE -->


    <section class="mt-5 text-center">


        <h4>

            Puntos:

            <span id="puntos">

                0

            </span>


        </h4>


    </section>







</main>







<!-- Bootstrap JS -->

<script 
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- JS DEL JUEGO -->

<script src="assets/js/juego.js"></script>



</body>


</html>
